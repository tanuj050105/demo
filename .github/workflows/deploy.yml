name: Deploy to EC2

# Trigger the workflow on push to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Deploy files using Rsync over SSH
      - name: Deploy to EC2 using SSH and Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        env:
          # The SSH private key from GitHub Secrets
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          # The EC2 public IP address from GitHub Secrets
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          # The EC2 username (ubuntu) from GitHub Secrets
          REMOTE_USER: ${{ secrets.EC2_USERNAME }}
          # The destination path on the EC2 server where Nginx serves files
          TARGET: /var/www/html/
          # Optional: Source directory to copy (empty means copy the root of the repo)
          SOURCE: ""
